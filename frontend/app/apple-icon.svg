<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" role="img" aria-label="AQUA">
  <defs>
    <linearGradient id="bg" x1="20" y1="10" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e5a8a"/>
      <stop offset="0.5" stop-color="#123a62"/>
      <stop offset="1" stop-color="#071526"/>
    </linearGradient>
    <linearGradient id="crystal-main" x1="55" y1="28" x2="125" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0fdff"/>
      <stop offset="0.3" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#67e8f9"/>
      <stop offset="0.8" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="facet-left" x1="45" y1="65" x2="90" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e7490" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#134e4a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="facet-right" x1="90" y1="65" x2="135" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cffafe"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 78) scale(68)">
      <stop stop-color="#67e8f9" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkle" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 48) scale(18)">
      <stop stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <circle cx="90" cy="82" r="64" fill="url(#glow)"/>
