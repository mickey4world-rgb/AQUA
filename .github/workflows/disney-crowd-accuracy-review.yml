name: Disney Crowd Accuracy Review

on:
  schedule:
    # 毎月1日 1:10 JST = 16:10 UTC（前日）
    - cron: "10 16 1 * *"
  workflow_dispatch:

jobs:
  accuracy_review:
    runs-on: ubuntu-latest
    steps:
      - name: Run monthly crowd review
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
        run: |
          if [ -z "$SOLUNA_CRON_SECRET" ]; then
            echo "SOLUNA_CRON_SECRET not set; skip"
            exit 0
          fi
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          curl -sfS -X POST \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${BASE%/}/api/disney/cron/accuracy-review?monthly=1" \
            -d '{}' \
            --max-time 120
