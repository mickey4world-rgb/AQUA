name: Soluna Asset Trade (background)

# 朝のブリーフィングに縛らず、月次目標に向けて裏で売買判断する
# 当日討伐未完了なら status で検知し ensure を実行（軽量チェック → 必要時のみ長時間 API）
on:
  schedule:
    # 1時間ごと（UTC）= 市場変化に追従して利益チャンスを拾う
    - cron: "20 * * * *"
  workflow_dispatch:

jobs:
  run_asset_trade:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure daily news battle if missing
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          STATUS_CODE=$(curl -sS --max-time 30 -o /tmp/soluna-status.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"step":"status"}')
          cat /tmp/soluna-status.json
          echo ""
          echo "status HTTP ${STATUS_CODE}"
          NEEDS=$(python3 -c "import json; d=json.load(open('/tmp/soluna-status.json')); print('true' if d.get('needsBriefing') else 'false')" 2>/dev/null || echo "false")
          if [ "${NEEDS}" != "true" ]; then
            echo "本日の討伐は完了済み。ensure をスキップします。"
            exit 0
          fi
          echo "::warning::本日の討伐が未完了。ensure を実行します。"
          HTTP_CODE=$(curl -sS --max-time 180 -o /tmp/soluna-ensure.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"step":"ensure"}')
          cat /tmp/soluna-ensure.json
          echo ""
          echo "ensure HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::warning::ensureDailyBriefing HTTP ${HTTP_CODE}"
          fi

      - name: Run background asset trade tick
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          HTTP_CODE=$(curl -sS -o /tmp/soluna-asset.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/asset-trade" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')
          cat /tmp/soluna-asset.json
          echo ""
          echo "HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" -ge 200 && test "${HTTP_CODE}" -lt 300
