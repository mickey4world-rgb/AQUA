name: Works News Search Digest

on:
  schedule:
    # 毎日深夜〜早朝に確実取得（JST）
    - cron: "30 15 * * *" # 0:30 JST
    - cron: "0 16 * * *"  # 1:00 JST
    - cron: "30 16 * * *" # 1:30 JST
    - cron: "0 17 * * *"  # 2:00 JST キャッチアップ
    # 朝の未完了ゲート（JST 7:00）— incomplete なら強制再実行し、それでも失敗なら red
    - cron: "0 22 * * *" # 7:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: "full / enrich-only / morning-gate / schedule-probe（次定時のスキップ判定だけ検証）"
        type: choice
        options:
          - full
          - enrich-only
          - morning-gate
          - schedule-probe
        default: full

jobs:
  schedule_probe:
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'schedule-probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe next-schedule skip decision (schema + isToday)
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node frontend/scripts/probe-works-news-schedule.mjs

  build_digest:
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'morning-gate' && github.event.inputs.mode != 'enrich-only' && github.event.inputs.mode != 'schedule-probe'
      || github.event_name == 'schedule' && github.event.schedule != '0 22 * * *'
    runs-on: ubuntu-latest
    steps:
      # checkout を先に置き、スキップ判定をリポジトリ内スクリプトと共有（次定時オラクルと同一ロジック）
      - uses: actions/checkout@v4

      - name: Skip if today's digest already complete
        id: gate
        if: github.event_name == 'schedule'
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node frontend/scripts/probe-works-news-schedule.mjs --gate

      - name: Setup Node.js
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (RSS parse)
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build news search digest (RSS → ingest → enrich with retries)
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node frontend/scripts/fetch-works-news-search.mjs --force
          else
            node frontend/scripts/fetch-works-news-search.mjs
          fi

  enrich_retry:
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'enrich-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Retry enrich only (failed categories, multi-pass)
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node frontend/scripts/fetch-works-news-search.mjs --enrich-only

  morning_gate:
    if: >
      github.event_name == 'schedule' && github.event.schedule == '0 22 * * *'
      || github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'morning-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Check enrichment status (same probe as night skip)
        id: status
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          node frontend/scripts/probe-works-news-schedule.mjs --gate
          # --gate は skip=true のとき当日 complete。morning では ok= に読み替え
          if grep -q '^skip=true' "$GITHUB_OUTPUT"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Force full rebuild if incomplete
        if: steps.status.outputs.ok != 'true'
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node frontend/scripts/fetch-works-news-search.mjs --force

      - name: Require enrichment complete (morning oracle)
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node frontend/scripts/probe-works-news-schedule.mjs --require-complete
