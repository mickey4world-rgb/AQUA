name: Works Money Flow Public Warm

on:
  schedule:
    # 毎週月曜 0:10 JST = 日曜 15:10 UTC（同梱データは静的なので頻度は低くてよい）
    - cron: "10 15 * * 0"
  workflow_dispatch:

jobs:
  warm_works_money_flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build public preview snapshot
        run: npm run build:gyosei-preview
      - name: Upload snapshot to production cache
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
        run: |
          if [ -z "$SOLUNA_CRON_SECRET" ]; then
            echo "SOLUNA_CRON_SECRET not set; skip upload"
            exit 0
          fi
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          # 集計は GHA 側で完了済み。本番は保存のみ。
          jq -c '{snapshot: .}' data/gyosei/public-preview.json > /tmp/warm-body.json
          curl -sfS -X POST \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/warm-body.json \
            "${BASE%/}/api/public/works-money-flow/warm" \
            --max-time 60
