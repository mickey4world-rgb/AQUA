name: Security Daily Triage

# 毎朝 7:00 JST。脆弱性・コード解析・防御履歴を集め、本番で AI 診断する。
# 17:00 JST（無料枠の日次リセット後）は、朝の AI 要約が失敗した日だけやり直す。
# 結果はアクセス・セキュリティ分析画面で確認する（メール通知なし）。
# 公開リポジトリなのでログには警戒レベルだけを出し、脆弱性の中身は出さない。
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      retry_only:
        description: "本日の AI 要約が成功済みなら何もしない"
        type: boolean
        default: false

permissions:
  contents: read
  security-events: read
  pull-requests: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
          RETRY_ONLY: ${{ github.event.schedule == '0 8 * * *' || inputs.retry_only == true }}
        run: |
          node .github/scripts/security-collect.mjs > "$RUNNER_TEMP/findings.json"
          if [ "$RETRY_ONLY" = "true" ]; then
            node -e 'const f=process.argv[1];const fs=require("fs");const j=JSON.parse(fs.readFileSync(f,"utf8"));j.onlyIfAiFailed=true;fs.writeFileSync(f,JSON.stringify(j));' "$RUNNER_TEMP/findings.json"
          fi

      - name: AI triage on production
        id: triage
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
        run: |
          if [ -z "$SOLUNA_CRON_SECRET" ]; then
            echo "::error::SOLUNA_CRON_SECRET not set"
            exit 1
          fi
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          curl -sS --max-time 10 https://api.ipify.org > "$RUNNER_TEMP/myip.txt" || true
          status=""
          for i in 1 2 3; do
            status=$(curl -sS -o "$RUNNER_TEMP/triage.json" -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/findings.json" \
              --max-time 110 \
              "${BASE%/}/api/security/cron/daily-triage" || true)
            stage=$(node -e 'try{const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(r.failedStage??"-")+" "+String(r.elapsedMs??"-")+"ms")}catch{process.stdout.write("non-json")}' "$RUNNER_TEMP/triage.json")
            echo "attempt $i status=$status stage/elapsed=$stage"
            if [ "$status" = "200" ]; then break; fi
            sleep $((20 * i))
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Judge result
        env:
          HTTP_STATUS: ${{ steps.triage.outputs.status }}
        run: |
          node -e '
            const fs = require("fs");
            const status = process.env.HTTP_STATUS;
            let r = null;
            try { r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/triage.json", "utf8")); } catch {}
            const summary = (line) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
            if (status !== "200" || !r || !r.ok) {
              const where = r && r.failedStage ? "（工程: " + r.failedStage + "）" : "";
              summary("診断失敗: 本番の診断 API が失敗しました" + where + "。");
              console.log("::error::triage failed (HTTP " + status + ", stage " + (r && r.failedStage ? r.failedStage : "-") + ")");
              process.exit(1);
            }
            summary("警戒レベル: " + r.level + " / AI: " + r.aiStatus + "（" + r.aiModel + "）");
            if (r.incompleteSources.length) summary("取得できなかった情報源: " + r.incompleteSources.join(", "));
            console.log("level=" + r.level + " ai=" + r.aiStatus + " model=" + r.aiModel);
            if (r.aiFailure) console.log("aiFailure=" + r.aiFailure);
            let myIp = "";
            try { myIp = fs.readFileSync(process.env.RUNNER_TEMP + "/myip.txt", "utf8").trim(); } catch {}
            if (myIp) {
              const mine = require("crypto").createHash("sha256").update(myIp).digest("hex").slice(0, 12);
              const match = mine === r.resolvedIpHash;
              console.log("client-ip resolution " + (match ? "OK" : "MISMATCH"));
              summary("送信元IPの判定: " + (match ? "正常" : "不一致（自動ブロックの識別を要確認）"));
              if (!match) console.log("::warning::server resolved a different client IP than this runner");
            }
          '
