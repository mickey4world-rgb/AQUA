name: Soluna System Briefing

on:
  schedule:
    # 毎日 9:00 JST = 0:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run_system_briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (scripts only)
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Fetch news briefing (Gemini → RSS fallback)
        id: fetch_news
        continue-on-error: true
        env:
          GEMINI_RELAY_URL: ${{ secrets.GEMINI_RELAY_URL }}
          GEMINI_RELAY_KEY: ${{ secrets.GEMINI_RELAY_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node frontend/scripts/fetch-soluna-news.mjs

      - name: Warn if news fetch failed
        if: steps.fetch_news.outcome == 'failure'
        run: echo "::warning::ニュース取得が失敗しました。前日のブリーフィングでシステムチャットを続行します。"

      - name: Run system chat
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BODY='{"force": true, "step": "chat"}'
          else
            BODY='{"step": "chat"}'
          fi
          HTTP_CODE=$(curl -sS -o /tmp/soluna-chat.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          cat /tmp/soluna-chat.json
          echo ""
          echo "HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" -ge 200 && test "${HTTP_CODE}" -lt 300

      - name: Run autonomous jobs (Note / BOINC / assets)
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BODY='{"force": true, "step": "jobs"}'
          else
            BODY='{"step": "jobs"}'
          fi
          HTTP_CODE=$(curl -sS -o /tmp/soluna-jobs.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          cat /tmp/soluna-jobs.json
          echo ""
          echo "HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" -ge 200 && test "${HTTP_CODE}" -lt 300

      - name: Extract BOINC plan from jobs response
        id: boinc_plan
        run: |
          MINUTES=$(python3 -c "import json; d=json.load(open('/tmp/soluna-jobs.json')); print(d.get('boincMinutes',0))" 2>/dev/null || echo "0")
          BRIEFING_ID=$(python3 -c "import json; d=json.load(open('/tmp/soluna-chat.json')); print(d.get('briefingId',''))" 2>/dev/null || echo "")
          echo "boinc_minutes=${MINUTES}" >> "$GITHUB_OUTPUT"
          echo "briefing_id=${BRIEFING_ID}" >> "$GITHUB_OUTPUT"
          echo "BOINC 計画: ${MINUTES} 分, briefingId: ${BRIEFING_ID}"

      - name: Run BOINC social contribution
        if: steps.boinc_plan.outputs.boinc_minutes != '0' && steps.boinc_plan.outputs.briefing_id != ''
        env:
          BOINC_ACCOUNT_KEY: ${{ secrets.BOINC_ACCOUNT_KEY }}
          BOINC_PROJECT_URL: ${{ vars.BOINC_PROJECT_URL }}
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RUN_MINUTES: ${{ steps.boinc_plan.outputs.boinc_minutes }}
          BRIEFING_ID: ${{ steps.boinc_plan.outputs.briefing_id }}
        run: |
          if [ -z "${BOINC_ACCOUNT_KEY}" ]; then
            echo "::warning::BOINC_ACCOUNT_KEY 未設定のためスキップ。GitHub Secrets に追加すると社会貢献が有効になります。"
            exit 0
          fi

          echo "=== BOINC 社会貢献 開始 ==="
          echo "実行予定: ${RUN_MINUTES} 分 / briefingId: ${BRIEFING_ID}"

          sudo apt-get install -y --no-install-recommends boinc-client -qq
          sudo systemctl start boinc-client || true
          sleep 3

          PROJECT_URL="${BOINC_PROJECT_URL:-https://www.worldcommunitygrid.org}"
          boinccmd --project_attach "${PROJECT_URL}" "${BOINC_ACCOUNT_KEY}" || true
          sleep 10

          START_TIME=$(date +%s)
          DEADLINE=$(( START_TIME + RUN_MINUTES * 60 ))
          boinccmd --run_benchmarks || true

          while [ $(date +%s) -lt $DEADLINE ]; do
            boinccmd --get_tasks 2>/dev/null | grep -E "fraction_done|state" | head -5 || true
            sleep 60
          done

          ACTUAL_MIN=$(( ($(date +%s) - START_TIME) / 60 ))
          TASKS=$(boinccmd --get_tasks 2>/dev/null | grep -c "state: uploaded" || echo "0")
          CREDIT=$(boinccmd --get_project_status 2>/dev/null | grep -oP "(?<=user_total_credit: )\S+" | head -1 || echo "0")
          PROJECT_NAME=$(boinccmd --get_project_status 2>/dev/null | grep -oP "(?<=project_name: ).+" | head -1 || echo "World Community Grid")

          boinccmd --project "${PROJECT_URL}" detach || true
          sudo systemctl stop boinc-client || true

          echo "=== BOINC 結果 ==="
          echo "実績: ${ACTUAL_MIN} 分, タスク ${TASKS} 件, クレジット ${CREDIT} cobblestones"
          echo "プロジェクト: ${PROJECT_NAME} (${PROJECT_URL})"

          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          HTTP_CODE=$(curl -sS -o /tmp/boinc-report.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/boinc-report" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"briefingId\":\"${BRIEFING_ID}\",\"creditGranted\":${CREDIT},\"tasksCompleted\":${TASKS},\"projectName\":\"${PROJECT_NAME}\",\"projectUrl\":\"${PROJECT_URL}\",\"runMinutesActual\":${ACTUAL_MIN}}")
          cat /tmp/boinc-report.json
          echo "HTTP ${HTTP_CODE}"
