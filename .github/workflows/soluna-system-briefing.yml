name: Soluna System Briefing

on:
  schedule:
    # GitHub Actions の schedule は混雑で数時間遅延し得るため、複数枠で取りこぼしを防ぐ
    # （API 側は同日二重実行をスキップする）
    - cron: "0 0 * * *"   # 9:00 JST 目標
    - cron: "30 0 * * *"  # 9:30 JST バックアップ
    - cron: "0 1 * * *"   # 10:00 JST キャッチアップ
  workflow_dispatch:

jobs:
  run_system_briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (scripts only)
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Fetch news briefing (Gemini → RSS fallback)
        id: fetch_news
        continue-on-error: true
        env:
          GEMINI_RELAY_URL: ${{ secrets.GEMINI_RELAY_URL }}
          GEMINI_RELAY_KEY: ${{ secrets.GEMINI_RELAY_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node frontend/scripts/fetch-soluna-news.mjs

      - name: Warn if news fetch failed
        if: steps.fetch_news.outcome == 'failure'
        run: echo "::warning::ニュース取得が失敗しました。前日のブリーフィングでシステムチャットを続行します。"

      - name: Run system chat
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BODY='{"force": true, "step": "chat"}'
          else
            BODY='{"step": "chat"}'
          fi
          HTTP_CODE=$(curl -sS -o /tmp/soluna-chat.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          cat /tmp/soluna-chat.json
          echo ""
          echo "HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" -ge 200 && test "${HTTP_CODE}" -lt 300

      - name: Run autonomous jobs (Note / BOINC / assets)
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BODY='{"force": true, "step": "jobs"}'
          else
            BODY='{"step": "jobs"}'
          fi
          HTTP_CODE=$(curl -sS -o /tmp/soluna-jobs.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          cat /tmp/soluna-jobs.json
          echo ""
          echo "HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" -ge 200 && test "${HTTP_CODE}" -lt 300

      - name: Extract BOINC plan from jobs response
        id: boinc_plan
        run: |
          MINUTES=$(python3 -c "import json; d=json.load(open('/tmp/soluna-jobs.json')); print(d.get('boincMinutes',0))" 2>/dev/null || echo "0")
          BRIEFING_ID=$(python3 -c "import json; d=json.load(open('/tmp/soluna-chat.json')); print(d.get('briefingId',''))" 2>/dev/null || echo "")
          echo "boinc_minutes=${MINUTES}" >> "$GITHUB_OUTPUT"
          echo "briefing_id=${BRIEFING_ID}" >> "$GITHUB_OUTPUT"
          echo "BOINC 計画: ${MINUTES} 分, briefingId: ${BRIEFING_ID}"

      - name: Run BOINC social contribution
        if: steps.boinc_plan.outputs.boinc_minutes != '0' && steps.boinc_plan.outputs.briefing_id != ''
        env:
          BOINC_ACCOUNT_KEY: ${{ secrets.BOINC_ACCOUNT_KEY }}
          BOINC_PROJECT_URL: ${{ vars.BOINC_PROJECT_URL }}
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RUN_MINUTES: ${{ steps.boinc_plan.outputs.boinc_minutes }}
          BRIEFING_ID: ${{ steps.boinc_plan.outputs.briefing_id }}
        run: |
          if [ -z "${BOINC_ACCOUNT_KEY}" ]; then
            echo "::warning::BOINC_ACCOUNT_KEY 未設定のためスキップ。GitHub Secrets に追加すると社会貢献が有効になります。"
            exit 0
          fi
          chmod +x frontend/scripts/run-soluna-boinc.sh
          sed -i 's/\r$//' frontend/scripts/run-soluna-boinc.sh || true
          frontend/scripts/run-soluna-boinc.sh
