name: Soluna System Briefing

on:
  schedule:
    # GitHub Actions の schedule は混雑で遅延・取りこぼしし得るため、朝〜夜まで複数枠
    # （API 側は当日ブリーフィング＋討伐が揃っていればスキップ）
    # JST = UTC+9
    - cron: "0 18 * * *" # 3:00 JST
    - cron: "0 19 * * *" # 4:00 JST
    - cron: "0 20 * * *" # 5:00 JST
    - cron: "0 21 * * *" # 6:00 JST
    - cron: "0 22 * * *" # 7:00 JST
    - cron: "0 23 * * *" # 8:00 JST
    - cron: "0 0 * * *"  # 9:00 JST
    - cron: "0 3 * * *"  # 12:00 JST 昼キャッチアップ
    - cron: "0 6 * * *"  # 15:00 JST
    - cron: "0 9 * * *"  # 18:00 JST
    - cron: "0 12 * * *" # 21:00 JST 夜キャッチアップ
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-run chat/jobs even if today's briefing is complete"
        required: false
        default: false
        type: boolean

jobs:
  run_system_briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (scripts only)
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Check daily briefing status
        id: status
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          HTTP_CODE=$(curl -sS --max-time 30 -o /tmp/soluna-status.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"step":"status"}')
          cat /tmp/soluna-status.json
          echo ""
          echo "status HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" -ge 200 && test "${HTTP_CODE}" -lt 300
          COMPLETE=$(python3 -c "import json; d=json.load(open('/tmp/soluna-status.json')); print('true' if d.get('complete') else 'false')" 2>/dev/null || echo "false")
          BOINC_NEEDS=$(python3 -c "import json; d=json.load(open('/tmp/soluna-status.json')); print('true' if d.get('boincNeedsRun') else 'false')" 2>/dev/null || echo "false")
          BOINC_MIN=$(python3 -c "import json; d=json.load(open('/tmp/soluna-status.json')); print(int(d.get('boincMinutes') or 0))" 2>/dev/null || echo "0")
          BOINC_BID=$(python3 -c "import json; d=json.load(open('/tmp/soluna-status.json')); print(d.get('boincBriefingId') or d.get('todayBriefingId') or '')" 2>/dev/null || echo "")
          echo "complete=${COMPLETE}" >> "$GITHUB_OUTPUT"
          echo "boinc_needs_run=${BOINC_NEEDS}" >> "$GITHUB_OUTPUT"
          echo "pending_boinc_minutes=${BOINC_MIN}" >> "$GITHUB_OUTPUT"
          echo "pending_boinc_briefing_id=${BOINC_BID}" >> "$GITHUB_OUTPUT"
          FORCE_INPUT="${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}"
          if [ "${COMPLETE}" != "true" ] || [ "${FORCE_INPUT}" = "true" ]; then
            echo "run_pipeline=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_pipeline=false" >> "$GITHUB_OUTPUT"
          fi
          echo "force=${FORCE_INPUT}" >> "$GITHUB_OUTPUT"

      - name: Fetch news briefing (Gemini grounding → RSS; no ungrounded LLM)
        if: steps.status.outputs.run_pipeline == 'true'
        id: fetch_news
        continue-on-error: true
        env:
          GEMINI_RELAY_URL: ${{ secrets.GEMINI_RELAY_URL }}
          GEMINI_RELAY_KEY: ${{ secrets.GEMINI_RELAY_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node frontend/scripts/fetch-soluna-news.mjs

      - name: Require today's live briefing before chat
        if: steps.status.outputs.run_pipeline == 'true'
        id: live_gate
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          HTTP_CODE=$(curl -sS --max-time 30 -o /tmp/soluna-live.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"step":"status"}')
          cat /tmp/soluna-live.json
          echo ""
          echo "live-gate HTTP ${HTTP_CODE}"
          LIVE_OK=$(python3 -c "import json; d=json.load(open('/tmp/soluna-live.json')); print('true' if d.get('liveNewsOk') else 'false')" 2>/dev/null || echo "false")
          SOURCE=$(python3 -c "import json; d=json.load(open('/tmp/soluna-live.json')); print(d.get('briefingSource') or '')" 2>/dev/null || echo "")
          echo "liveNewsOk=${LIVE_OK} source=${SOURCE}"
          if [ "${LIVE_OK}" != "true" ]; then
            echo "::error::当日ライブニュースが無いのに討伐へ進むのは禁止（意図しない代替成功の再発防止）。fetch outcome=${{ steps.fetch_news.outcome }}"
            exit 1
          fi

      - name: Run system chat
        if: steps.status.outputs.run_pipeline == 'true' && steps.live_gate.outcome == 'success'
        id: chat
        continue-on-error: true
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          if [ "${{ steps.status.outputs.force }}" = "true" ]; then
            BODY='{"force": true, "step": "chat"}'
          else
            BODY='{"step": "chat"}'
          fi
          HTTP_CODE=$(curl -sS --max-time 180 -o /tmp/soluna-chat.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          cat /tmp/soluna-chat.json
          echo ""
          echo "chat HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::warning::chat HTTP ${HTTP_CODE}（SWA 45秒制限でタイムアウトした場合、サーバー側は継続処理中のことがあります）"
          fi

      - name: Wait for chat if gateway timed out
        if: steps.status.outputs.run_pipeline == 'true' && steps.live_gate.outcome == 'success'
        run: sleep 90

      - name: Verify briefing complete
        if: steps.status.outputs.run_pipeline == 'true' && steps.live_gate.outcome == 'success'
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          HTTP_CODE=$(curl -sS --max-time 30 -o /tmp/soluna-status2.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"step":"status"}')
          cat /tmp/soluna-status2.json
          echo ""
          COMPLETE=$(python3 -c "import json; d=json.load(open('/tmp/soluna-status2.json')); print('true' if d.get('complete') else 'false')" 2>/dev/null || echo "false")
          LIVE_OK=$(python3 -c "import json; d=json.load(open('/tmp/soluna-status2.json')); print('true' if d.get('liveNewsOk') else 'false')" 2>/dev/null || echo "false")
          if [ "${COMPLETE}" != "true" ] || [ "${LIVE_OK}" != "true" ]; then
            echo "::error::本日の討伐が未完了、またはライブニュース条件を満たしません（status HTTP ${HTTP_CODE}）"
            exit 1
          fi

      - name: Run autonomous jobs (Note / BOINC / assets)
        if: steps.status.outputs.run_pipeline == 'true' && steps.live_gate.outcome == 'success'
        id: jobs
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          if [ "${{ steps.status.outputs.force }}" = "true" ]; then
            BODY='{"force": true, "step": "jobs"}'
          else
            BODY='{"step": "jobs"}'
          fi
          HTTP_CODE=$(curl -sS --max-time 120 -o /tmp/soluna-jobs.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          cat /tmp/soluna-jobs.json
          echo ""
          echo "jobs HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" -ge 200 && test "${HTTP_CODE}" -lt 300
          BRIEFING_ID=$(python3 -c "import json; d=json.load(open('/tmp/soluna-status2.json')); print(d.get('todayBriefingId',''))" 2>/dev/null || echo "")
          BOINC=$(python3 -c "import json; d=json.load(open('/tmp/soluna-jobs.json')); print(d.get('boincMinutes',0))" 2>/dev/null || echo "0")
          echo "briefing_id=${BRIEFING_ID}" >> "$GITHUB_OUTPUT"
          echo "boinc_minutes=${BOINC}" >> "$GITHUB_OUTPUT"

      - name: Resolve BOINC run inputs
        id: boinc_inputs
        run: |
          # 新規 jobs 後、または討伐完了後の未実施/失敗リトライ
          JOB_MIN="${{ steps.jobs.outputs.boinc_minutes }}"
          JOB_BID="${{ steps.jobs.outputs.briefing_id }}"
          PEND_MIN="${{ steps.status.outputs.pending_boinc_minutes }}"
          PEND_BID="${{ steps.status.outputs.pending_boinc_briefing_id }}"
          NEEDS="${{ steps.status.outputs.boinc_needs_run }}"
          MINUTES="0"
          BID=""
          if [ -n "${JOB_MIN}" ] && [ "${JOB_MIN}" != "0" ] && [ -n "${JOB_BID}" ]; then
            MINUTES="${JOB_MIN}"
            BID="${JOB_BID}"
          elif [ "${NEEDS}" = "true" ] && [ -n "${PEND_BID}" ] && [ "${PEND_MIN}" != "0" ]; then
            MINUTES="${PEND_MIN}"
            BID="${PEND_BID}"
          fi
          echo "minutes=${MINUTES}" >> "$GITHUB_OUTPUT"
          echo "briefing_id=${BID}" >> "$GITHUB_OUTPUT"
          echo "will_run=$([ -n "${BID}" ] && [ "${MINUTES}" != "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run BOINC social contribution
        if: steps.boinc_inputs.outputs.will_run == 'true'
        env:
          BOINC_ACCOUNT_KEY: ${{ secrets.BOINC_ACCOUNT_KEY }}
          BOINC_PROJECT_URL: ${{ vars.BOINC_PROJECT_URL }}
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RUN_MINUTES: ${{ steps.boinc_inputs.outputs.minutes }}
          BRIEFING_ID: ${{ steps.boinc_inputs.outputs.briefing_id }}
        run: |
          if [ -z "${BOINC_ACCOUNT_KEY}" ]; then
            echo "::error::BOINC_ACCOUNT_KEY 未設定のため社会貢献を実行できません。"
            exit 1
          fi
          chmod +x frontend/scripts/run-soluna-boinc.sh
          sed -i 's/\r$//' frontend/scripts/run-soluna-boinc.sh || true
          frontend/scripts/run-soluna-boinc.sh
