name: Soluna System Briefing

on:
  schedule:
    # GitHub Actions の schedule は混雑で遅延・取りこぼしし得るため、朝〜夜まで複数枠
    # （API 側は同日のブリーフィング＋討伐が揃っていればスキップ）
    # JST = UTC+9
    - cron: "0 21 * * *" # 6:00 JST
    - cron: "0 22 * * *" # 7:00 JST
    - cron: "0 23 * * *" # 8:00 JST
    - cron: "0 0 * * *"  # 9:00 JST
    - cron: "0 3 * * *"  # 12:00 JST 昼キャッチアップ
    - cron: "0 6 * * *"  # 15:00 JST
    - cron: "0 9 * * *"  # 18:00 JST
    - cron: "0 12 * * *" # 21:00 JST 夜キャッチアップ
  workflow_dispatch:

jobs:
  run_system_briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (scripts only)
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Fetch news briefing (Gemini → RSS fallback)
        id: fetch_news
        continue-on-error: true
        env:
          GEMINI_RELAY_URL: ${{ secrets.GEMINI_RELAY_URL }}
          GEMINI_RELAY_KEY: ${{ secrets.GEMINI_RELAY_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node frontend/scripts/fetch-soluna-news.mjs

      - name: Warn if news fetch failed
        if: steps.fetch_news.outcome == 'failure'
        run: echo "::warning::ニュース取得が失敗しました。API 側で RSS フォールバックまたは前日ブリーフィングを使います。"

      - name: Ensure daily briefing (news + chat + jobs)
        id: ensure
        env:
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://www.aquacore.net}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BODY='{"force": true, "step": "ensure"}'
          else
            BODY='{"step": "ensure"}'
          fi
          HTTP_CODE=$(curl -sS --max-time 180 -o /tmp/soluna-ensure.json -w "%{http_code}" \
            -X POST "${BASE%/}/api/soluna/cron/system-briefing" \
            -H "Authorization: Bearer ${SOLUNA_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          cat /tmp/soluna-ensure.json
          echo ""
          echo "HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" -ge 200 && test "${HTTP_CODE}" -lt 300
          SKIPPED=$(python3 -c "import json; d=json.load(open('/tmp/soluna-ensure.json')); print('true' if d.get('skipped') else 'false')" 2>/dev/null || echo "false")
          BRIEFING_ID=$(python3 -c "import json; d=json.load(open('/tmp/soluna-ensure.json')); print(d.get('briefingId',''))" 2>/dev/null || echo "")
          BOINC=$(python3 -c "import json; d=json.load(open('/tmp/soluna-ensure.json')); print(d.get('boincMinutes',0))" 2>/dev/null || echo "0")
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"
          echo "briefing_id=${BRIEFING_ID}" >> "$GITHUB_OUTPUT"
          echo "boinc_minutes=${BOINC}" >> "$GITHUB_OUTPUT"

      - name: Run BOINC social contribution
        if: steps.ensure.outputs.boinc_minutes != '0' && steps.ensure.outputs.briefing_id != ''
        env:
          BOINC_ACCOUNT_KEY: ${{ secrets.BOINC_ACCOUNT_KEY }}
          BOINC_PROJECT_URL: ${{ vars.BOINC_PROJECT_URL }}
          SOLUNA_CRON_SECRET: ${{ secrets.SOLUNA_CRON_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RUN_MINUTES: ${{ steps.ensure.outputs.boinc_minutes }}
          BRIEFING_ID: ${{ steps.ensure.outputs.briefing_id }}
        run: |
          if [ -z "${BOINC_ACCOUNT_KEY}" ]; then
            echo "::warning::BOINC_ACCOUNT_KEY 未設定のためスキップ。GitHub Secrets に追加すると社会貢献が有効になります。"
            exit 0
          fi
          chmod +x frontend/scripts/run-soluna-boinc.sh
          sed -i 's/\r$//' frontend/scripts/run-soluna-boinc.sh || true
          frontend/scripts/run-soluna-boinc.sh
