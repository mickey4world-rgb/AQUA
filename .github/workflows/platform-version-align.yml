name: Platform Version Align

# ソース依存以外: Azure SWA Managed API が許す最大 Node にリポジトリ内ピンを揃える。
# SWA が node:24 を載せたら自動で上げる。載せない間は上限のまま。
on:
  schedule:
    # 毎週土曜 7:30 JST（= 金曜 22:30 UTC）
    - cron: "30 22 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Probe SWA docs vs repo pins
        id: probe
        working-directory: frontend
        run: |
          set +e
          npx --yes tsx scripts/platform-version-align.ts > "$RUNNER_TEMP/platform.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/platform.json"
          node <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/platform.json", "utf8"));
          const summary = (line) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          summary("## Host constraint (SWA Managed API)");
          summary("- SWA max Node: **" + (r.swaMaxMajor ?? "unknown") + "**");
          summary("- Target: **" + (r.targetMajor ?? "none") + "**");
          if (r.parseError) summary("- Parse error: " + r.parseError);
          summary("- Misaligned files: " + (r.todo?.length ?? 0));
          if (r.todo?.length) summary("- Paths: " + r.todo.join(", "));
          const need = Boolean(r.ok && r.todo && r.todo.length > 0);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `need_apply=${need}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `target=${r.targetMajor ?? ""}\n`);
          NODE
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Apply alignment
        if: steps.probe.outputs.need_apply == 'true'
        working-directory: frontend
        run: npx --yes tsx scripts/platform-version-align.ts --apply

      - name: Install and verify
        if: steps.probe.outputs.need_apply == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run -s test:platform-versions
          npm run -s test:security-automation
          npm run build

      - name: Open PR, merge, deploy
        if: steps.probe.outputs.need_apply == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.probe.outputs.target }}
        run: |
          BRANCH="chore/platform-node-${TARGET}-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "no file changes after apply"
            exit 0
          fi
          git commit -m "chore: align Node pins to SWA managed max (node:${TARGET})"
          git push -u origin "$BRANCH"
          gh label create platform-versions --color "0E8A16" --description "Host runtime alignment (SWA apiRuntime)" 2>/dev/null || true
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          cat > "$BODY_FILE" <<EOF
          Align repo Node pins to Azure Static Web Apps Managed API max (node:${TARGET}).

          - Constraint source: SWA Managed API
          - Touches: staticwebapp.config.json, Actions node-version, package engines, design doc
          - gemini-proxy Azure runtime change is separate; engines declaration only

          Verified with tsc / tests / build. Deploy will be dispatched after merge.
          EOF
          PR_URL=$(gh pr create --title "chore: Node ${TARGET} (SWA managed max)" --label "platform-versions" --body-file "$BODY_FILE" --base main --head "$BRANCH")
          echo "PR=$PR_URL"
          gh pr merge "$PR_URL" --squash --delete-branch
          gh workflow run azure-static-web-apps.yml --ref main
          echo "deploy dispatched"
